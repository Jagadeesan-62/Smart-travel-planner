[project]
name = "smart_travel_planner"
version = "0.1.0"
description = "smart_travel_planner using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.11,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_travel_planner"]

[tool.crewai]
type = "flow"
definition = "src/smart_travel_planner/flow.json"
project_id = "b85ffbf8-0599-425c-8b3e-0ba5540ecce6"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
